<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Test Streaming Backend</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        #output { background: #f5f5f5; padding: 10px; height: 300px; overflow-y: auto; border: 1px solid #ccc; margin: 10px 0; }
        .chunk { margin: 2px 0; padding: 2px 5px; background: #e8f5e8; border-radius: 3px; }
        .error { background: #ffe8e8; color: red; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <h1>🧪 Test Streaming Backend</h1>
    <button onclick="testStreaming()">Test Streaming</button>
    <div id="output"></div>

    <script>
        const output = document.getElementById('output');
        
        function log(message, isError = false) {
            const div = document.createElement('div');
            div.className = isError ? 'chunk error' : 'chunk';
            div.innerHTML = `<strong>${new Date().toLocaleTimeString()}</strong>: ${message}`;
            output.appendChild(div);
            output.scrollTop = output.scrollHeight;
        }

        async function testStreaming() {
            output.innerHTML = '';
            log('🚀 Starting streaming test...');
            
            try {
                const response = await fetch('http://localhost:10000/chat/stream', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        message: 'Học vovinam ở FPTU như thế nào?',
                        history: []
                    }),
                });

                log(`📡 Response status: ${response.status}`);
                
                if (!response.ok) {
                    const errorText = await response.text();
                    log(`❌ Error: ${errorText}`, true);
                    return;
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let accumulatedText = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) {
                        log('🏁 Stream ended');
                        break;
                    }
                    
                    const chunk = decoder.decode(value, { stream: true });
                    log(`📦 Chunk: ${chunk.substring(0, 100)}...`);
                    
                    const lines = chunk.split("\n\n").filter(line => line.trim());
                    
                    for (const line of lines) {
                        if (!line.startsWith("data: ")) continue;
                        
                        try {
                            const payload = JSON.parse(line.slice(6));
                            
                            if (payload.type === "chunk") {
                                accumulatedText += payload.text || '';
                                log(`🔤 Text: "${payload.text}"`);
                                log(`📝 Accumulated: "${accumulatedText.substring(0, 100)}..."`);
                            } else if (payload.type === "done") {
                                log('✅ Done signal received');
                            } else if (payload.type === "error") {
                                log(`❌ Server error: ${payload.text}`, true);
                            }
                        } catch (parseError) {
                            log(`❌ Parse error: ${parseError}`, true);
                        }
                    }
                }
                
                log(`🎉 Final text: ${accumulatedText}`);
                
            } catch (error) {
                log(`❌ Network error: ${error.message}`, true);
            }
        }
    </script>
</body>
</html>
